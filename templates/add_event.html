<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Create Event | Campusly</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">

</head>

<body>

<nav class="navbar">

    <a href="{{ url_for('home') }}" class="logo">

        <div class="logo-icon">
            C
        </div>

        <div>
            <h2>Campusly</h2>
            <span>CAMPUS EVENTS</span>
        </div>

    </a>

    <div class="nav-links">

        <a href="{{ url_for('home') }}">
            Home
        </a>

        <a href="{{ url_for('events') }}">
            Events
        </a>

        <a href="{{ url_for('registrations') }}">
            My Registrations
        </a>

        <a href="{{ url_for('add_event') }}" class="active">
            Create Event
        </a>

    </div>

    <a href="{{ url_for('add_event') }}" class="nav-button">
        + Create Event
    </a>

</nav>


<main class="form-page">

    <div class="form-wrapper">

        <div class="form-heading">

            <span class="section-label">
                CAMPUSLY EVENT MANAGEMENT
            </span>

            <h1>Create a new event.</h1>

            <p>
                Add an event and make it visible to students across your campus.
            </p>

        </div>


        <div class="form-card">

            <form method="POST"
                  action="{{ url_for('add_event') }}">

                <div class="form-group">

                    <label for="name">
                        Event Name
                    </label>

                    <input
                        type="text"
                        id="name"
                        name="name"
                        placeholder="Enter event name"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="description">
                        Description
                    </label>

                    <textarea
                        id="description"
                        name="description"
                        rows="5"
                        placeholder="Describe your event..."
                        required
                    ></textarea>

                </div>


                <div class="form-row">

                    <div class="form-group">

                        <label for="date">
                            Event Date
                        </label>

                        <input
                            type="date"
                            id="date"
                            name="date"
                            required
                        >

                    </div>


                    <div class="form-group">

                        <label for="venue">
                            Venue
                        </label>

                        <input
                            type="text"
                            id="venue"
                            name="venue"
                            placeholder="Main Auditorium"
                            required
                        >

                    </div>

                </div>


                <div class="form-actions">

                    <a
                        href="{{ url_for('events') }}"
                        class="cancel-button"
                    >
                        Cancel
                    </a>

                    <button
                        type="submit"
                        class="create-event-button"
                    >
                        Create Event
                        <span>→</span>
                    </button>

                </div>

            </form>

        </div>

    </div>

</main>


<footer>

    <div class="footer-logo">

        <strong>Campusly</strong>

        <span>
            YOUR CAMPUS. YOUR EVENTS.
        </span>

    </div>

    <p>
        Campus event management platform
    </p>

</footer>


<script src="{{ url_for('static', filename='script.js') }}"></script>

</body>

</html>
